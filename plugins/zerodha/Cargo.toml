[package]
name = "opentrader-zerodha"
version = "0.1.0"
description = "OpenTrader data plugin for Zerodha Kite Connect (Indian stocks, indices, futures and options)"
edition = "2021"
publish = false

# A standalone program, never part of the app's build: its own workspace keeps any parent workspace out.
[workspace]

[[bin]]
name = "opentrader-zerodha"
path = "src/main.rs"

[dependencies]
opentrader-plugin-kit = { path = "../kit", features = ["socket"] }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
chrono-tz = "0.10"
ureq = { version = "3", features = ["cookies"] }
sha2 = "0.10"
csv = "1"
flate2 = "1"

[profile.release]
strip = true

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
# The tests' stand-in for the broker's stream.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
