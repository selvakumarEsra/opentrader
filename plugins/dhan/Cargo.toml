[package]
name = "opentrader-dhan"
version = "0.1.0"
description = "OpenTrader data plugin for Dhan (DhanHQ API: Indian stocks, indices, futures and options)"
edition = "2021"
publish = false

# A standalone program, never part of the app's build: its own workspace keeps any parent workspace out.
[workspace]

[[bin]]
name = "opentrader-dhan"
path = "src/main.rs"

[dependencies]
opentrader-plugin-kit = { path = "../kit" }
tokio = { version = "1.52", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
ureq = "3"
csv = "1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }

[profile.release]
strip = true

[dev-dependencies]
tokio = { version = "1.52", features = ["full", "test-util"] }
